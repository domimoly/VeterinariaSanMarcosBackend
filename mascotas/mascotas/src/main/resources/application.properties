spring.application.name=mascotas
server.port=8084

# Base de datos propia de este microservicio (XAMPP: MySQL en 3306, root sin contraseña)
spring.datasource.url=${MASCOTAS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_mascotas?createDatabaseIfNotExist=true}
spring.datasource.username=${MASCOTAS_DB_USER:root}
spring.datasource.password=${MASCOTAS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: mismo secreto que el servicio auth (variable JWT_SECRET o archivo local .env.properties)
spring.config.import=optional:file:.env.properties,optional:file:mascotas/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-san-marcos-auth
