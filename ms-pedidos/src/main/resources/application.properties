spring.application.name=ms-pedidos
server.port=8088
server.address=${SERVER_ADDRESS:0.0.0.0}

# Base de datos propia de este microservicio (XAMPP: MySQL en 3306, root sin contraseña)
spring.datasource.url=${PEDIDOS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_pedidos?createDatabaseIfNotExist=true}
spring.datasource.username=${PEDIDOS_DB_USER:root}
spring.datasource.password=${PEDIDOS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: mismo secreto que el servicio auth (variable JWT_SECRET o archivo local .env.properties)
spring.config.import=optional:file:.env.properties,optional:file:ms-pedidos/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-san-marcos-auth

# Origen (o varios separados por coma) del frontend autorizado por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ms-productos: catálogo y stock. La clave interna debe ser la misma que usa ms-productos.
app.productos.url=${PRODUCTOS_URL:http://localhost:8087}
app.interno.clave=${CLAVE_INTERNA}
