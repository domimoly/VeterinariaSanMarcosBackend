spring.application.name=servicios
server.port=8083

# Base de datos propia de este microservicio (XAMPP: MySQL en 3306, root sin contraseña)
spring.datasource.url=${SERVICIOS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_servicios?createDatabaseIfNotExist=true}
spring.datasource.username=${SERVICIOS_DB_USER:root}
spring.datasource.password=${SERVICIOS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: mismo secreto que el servicio auth (variable JWT_SECRET o archivo local .env.properties)
spring.config.import=optional:file:.env.properties,optional:file:servicios/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-san-marcos-auth
