spring.application.name=fichas
server.port=8086

# Base de datos propia de este microservicio (XAMPP: MySQL en 3306, root sin contraseña)
spring.datasource.url=${FICHAS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_fichas?createDatabaseIfNotExist=true}
spring.datasource.username=${FICHAS_DB_USER:root}
spring.datasource.password=${FICHAS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: mismo secreto que el servicio auth (variable JWT_SECRET o archivo local .env.properties)
spring.config.import=optional:file:.env.properties,optional:file:fichas/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-san-marcos-auth

# Dirección del microservicio mascotas
app.mascotas.url=${MASCOTAS_URL:http://localhost:8084}
