spring.application.name=auth
server.port=8082

# Base de datos (XAMPP: MySQL en 3306, usuario root sin contraseña)
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/veterinaria_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: el secreto NO se guarda en el repositorio. Viene de la variable JWT_SECRET
# o del archivo local .env.properties (ignorado por git, ver .env.properties.example)
spring.config.import=optional:file:.env.properties,optional:file:auth/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Cuenta inicial de recepción (se crea al primer arranque)
app.recepcion.correo=${RECEPCION_CORREO:recepcion@veterinariasanmarcos.cl}
app.recepcion.password=${RECEPCION_PASSWORD:Recepcion123!}
