spring.application.name=ms-productos
server.port=8087
server.address=${SERVER_ADDRESS:0.0.0.0}

# Base de datos propia de este microservicio (XAMPP: MySQL en 3306, root sin contraseña)
spring.datasource.url=${PRODUCTOS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_productos?createDatabaseIfNotExist=true}
spring.datasource.username=${PRODUCTOS_DB_USER:root}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: mismo secreto que el servicio auth (variable JWT_SECRET o archivo local .env.properties)
spring.config.import=optional:file:.env.properties,optional:file:ms-productos/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-san-marcos-auth

# Origen (o varios separados por coma) del frontend autorizado por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Clave compartida solo con ms-pedidos para descontar/devolver stock (variable CLAVE_INTERNA o .env.properties)
app.interno.clave=${CLAVE_INTERNA}
