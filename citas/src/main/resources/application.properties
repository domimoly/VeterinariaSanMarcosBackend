spring.application.name=citas
server.port=8085

# Base de datos propia de este microservicio (XAMPP: MySQL en 3306, root sin contraseña)
spring.datasource.url=${CITAS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_citas?createDatabaseIfNotExist=true}
spring.datasource.username=${CITAS_DB_USER:root}
spring.datasource.password=${CITAS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: mismo secreto que el servicio auth (variable JWT_SECRET o archivo local .env.properties)
spring.config.import=optional:file:.env.properties,optional:file:citas/.env.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-san-marcos-auth

# Dirección del microservicio mascotas
app.mascotas.url=${MASCOTAS_URL:http://localhost:8084}

# Dirección del microservicio servicios
app.servicios.url=${SERVICIOS_URL:http://localhost:8083}

# Reglas de agenda
app.agenda.cupos-por-bloque=3
app.agenda.anticipacion-minima-horas=2
app.agenda.anticipacion-maxima-semanas=4
